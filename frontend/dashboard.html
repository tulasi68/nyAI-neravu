<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nyai-Neravu · Secretary dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap">
<style>
:root{--bg:#eceff3;--sf:#fff;--ink:#17202b;--mu:#5b6776;--ln:#d3d9e1;--ac:#1d4f8f;--acs:#e3edf9;--ok:#13795b;--oks:#ddf3ea;--wa:#9a5b00;--was:#fdeccd;--er:#b3342a;--ers:#fbe1de;--ne:#475467;--nes:#e6e9ee;box-sizing:border-box}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 IBM Plex Sans,system-ui,sans-serif}
header{background:var(--sf);border-bottom:1px solid var(--ln);padding:12px 16px}
h1{font:600 20px Source Serif 4,Georgia,serif;margin:0 0 2px}h2{font:600 17px Source Serif 4,Georgia,serif;margin:0 0 8px}
.sub{color:var(--mu);font-size:13px}a{color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0}
nav button{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:8px 12px;border-radius:8px 8px 0 0;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--sf);border-color:var(--ac)}
main{padding:14px 16px 40px;max-width:980px;margin:0 auto}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
select,textarea,button.b{font:inherit;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:70px}button.b{cursor:pointer;font-weight:500}button.p{background:var(--ac);color:var(--sf);border-color:var(--ac)}button.g{background:var(--ok);color:var(--sf);border-color:var(--ok)}button.r{background:var(--er);color:var(--sf);border-color:var(--er)}button:disabled{opacity:.45;cursor:not-allowed}
.row{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--ln)}
.row:first-of-type{border-top:0}.row b{cursor:pointer}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--nes);color:var(--ne)}
.t-proposed,.t-awaiting{background:var(--was);color:var(--wa)}.t-settled,.t-closed{background:var(--oks);color:var(--ok)}.t-escalated{background:var(--ers);color:var(--er)}
.det{grid-column:2/4;background:var(--bg);border-radius:8px;padding:10px;font-size:14px}
.det p{margin:4px 0}.mu{color:var(--mu)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}.tile b{display:block;font:600 26px Source Serif 4,Georgia,serif}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--nes);margin:8px 0}.stack i{display:block}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:6px 4px;border-top:1px solid var(--ln)}th{color:var(--mu);font-weight:500}
.prop{border-left:4px solid var(--ac);background:var(--acs);padding:10px 12px;border-radius:6px;margin:8px 0}
.msg{font-size:14px;padding:6px 0;border-top:1px solid var(--ln)}.wrap{overflow-x:auto}
</style>
</head>
<body>
<header><h1>Nyai-Neravu · Secretary dashboard</h1><div class="sub"><a href="/"><b>← Home</b></a> · <a href="/workbench">End-to-end walkthrough</a> · <a href="/judgment-drafting">Judgment drafting</a> · <a href="/peoples-court">People's Court</a> · Mock data only; not a court system.</div></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const CATS=["Cheque bounce","Motor accident","Consumer dispute","Rent and tenancy","Government service"];
const OUT={"Cheque bounce":["Complaint allowed. Accused to pay the cheque amount with 9% interest and costs within 60 days.","Complaint dismissed. The demand notice was sent after the 30-day statutory limit."],"Motor accident":["Claim allowed. Compensation awarded by the standard multiplier method; insurer liable to pay.","Claim against insurer dismissed. Policy had lapsed; owner liable instead."],"Consumer dispute":["Complaint allowed. Refund with interest and compensation for deficiency in service.","Complaint dismissed. No deficiency proved on the documents filed."],"Rent and tenancy":["Eviction allowed. Tenant to vacate within 90 days after notice defects were found cured.","Eviction petition dismissed. Statutory notice was defective."],"Government service":["Petition allowed. Pension benefits to be released with arrears, following settled precedent.","Petition dismissed. Claim is barred by delay and laches."]};
const D=[["KA-CB-1041","Cheque bounce","Sri Ravi Traders","Mr. Anil Kumar","Cheque of ₹4.2 lakh dishonoured: insufficient funds.",["Cheque copy","Bank return memo","Demand notice","Postal receipt"],"Arguments filed; 6 adjournments",1460,0],["KA-CB-1058","Cheque bounce","Meena Enterprises","Mr. S. Prakash","Cheque of ₹1.8 lakh dishonoured; notice date disputed.",["Cheque copy","Return memo","Demand notice"],"Evidence stage; 4 adjournments",980,1],["KA-MA-2210","Motor accident","Mrs. Lakshmi","United Motors Insurance","Fatal accident claim; dependants seek compensation.",["FIR","Postmortem report","Income proof","Policy copy"],"Written statements filed",1720,0],["KA-CD-3302","Consumer dispute","Mrs. Kavitha","HomeNest Builders","Delayed flat possession; refund sought.",["Sale agreement","Payment receipts","Emails"],"Reply filed",1380,0],["KA-RT-4410","Rent and tenancy","Mr. H. Gowda (landlord)","Mr. P. Nair (tenant)","Eviction for non-payment of rent.",["Lease deed","Rent ledger","Notice"],"Evidence stage",1540,0],["KA-GS-5503","Government service","Mr. R. Murthy","State Pension Dept.","Retired teacher seeks pension arrears.",["Service book","Retirement order","Representation"],"Counter filed",1630,0]];
const S={role:"op",model:false,training:false,running:false,apiLive:false,sel:new Set(),open:null,fc:"",fs:"",pc:null,ps:"p",jc:null,log:[],cases:D.map(d=>({id:d[0],cat:d[1],pet:d[2],res:d[3],claim:d[4],proofs:d[5],hearing:d[6],age:d[7],lean:d[8],st:"pending",resp:{p:null,r:null},out:null,conf:0,days:0,msgs:[],by:null}))};
const LBL={pending:"Pending",proposed:"AI proposal ready",awaiting:"Awaiting parties",settled:"Settled by AI",escalated:"With judge",closed:"Closed by judge"};
const ROLES=[["op","Case operator"],["dash","Secretary dashboard"],["judge","Judge"],["party","Party"]];
const $=id=>document.getElementById(id),C=id=>S.cases.find(c=>c.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const tag=c=>`<span class="tag t-${c.st}">${LBL[c.st]}</span>`;
const note=t=>{S.log.unshift(t)};
function detail(c){const pred=c.pred?`<p class="mu">Model: type=<b>${esc(c.pred.case_type||"?")}</b> · outcome=<b>${esc(c.pred.outcome||"?")}</b></p>`:"";return `<div class="det"><p><b>Case:</b> ${esc(c.claim)}</p><p><b>Parties:</b> ${esc(c.pet)} versus ${esc(c.res)}</p><p><b>Proof:</b> ${c.proofs.map(esc).join(", ")}</p><p><b>Hearing:</b> ${esc(c.hearing)}</p>${pred}${c.out?`<div class="prop"><b>AI proposal (${c.conf}%):</b> ${esc(c.out)}</div>`:""}</div>`}
function opView(){const list=S.cases.filter(c=>(!S.fc||c.cat===S.fc)&&(!S.fs||c.st===S.fs));const nSel=[...S.sel].map(C);return `<div class="card"><h2>1. Learn from settled cases</h2><div class="bar"><button class="b p" data-a="train" ${S.training?"disabled":""}>${S.training?"Learning…":(S.model?"Model ready · Re-train":"Start learning")}</button><span class="sub">${S.model?"Model ready.":"Trains a demo model from synthetic cases."}</span></div></div><div class="card"><h2>2. Pending cases</h2><div class="bar"><select data-f="fc"><option value="">All categories</option>${CATS.map(x=>`<option ${S.fc===x?"selected":""}>${x}</option>`).join("")}</select><select data-f="fs"><option value="">All statuses</option>${Object.keys(LBL).map(k=>`<option value="${k}" ${S.fs===k?"selected":""}>${LBL[k]}</option>`).join("")}</select><span class="sub">${list.length} cases</span></div><div class="bar"><button class="b p" data-a="run" ${S.model&&!S.running&&nSel.some(c=>c.st==="pending")?"":"disabled"}>Apply learning to selected</button><button class="b p" data-a="send" ${nSel.some(c=>c.st==="proposed")?"":"disabled"}>Send proposal to parties</button><button class="b" data-a="sim" ${S.cases.some(c=>c.st==="awaiting")?"":"disabled"}>Demo: simulate party replies</button></div>${list.map(c=>`<div class="row"><input type="checkbox" data-s="${c.id}" ${S.sel.has(c.id)?"checked":""}><div><b data-o="${c.id}">${c.id}: ${esc(c.pet)} versus ${esc(c.res)}</b><div class="sub">${c.cat} · ${esc(c.hearing)}</div></div>${tag(c)}${S.open===c.id?detail(c):""}</div>`).join("")||'<p class="sub">No cases match.</p>'}</div>`}
function dashView(){const n=k=>S.cases.filter(c=>c.st===k).length,T=S.cases.length;const col={pending:"var(--ne)",proposed:"var(--wa)",awaiting:"var(--wa)",settled:"var(--ok)",escalated:"var(--er)",closed:"var(--ac)"};const done=S.cases.filter(c=>c.st==="settled"||c.st==="closed");return `<div class="tiles">${Object.keys(LBL).map(k=>`<div class="tile"><b>${n(k)}</b><span class="sub">${LBL[k]}</span></div>`).join("")}</div><div class="card"><h2>Overall progress</h2><div class="stack">${Object.keys(LBL).map(k=>`<i style="width:${n(k)/T*100}%;background:${col[k]}"></i>`).join("")}</div><p class="sub">${done.length} of ${T} cases resolved (demo).</p></div><div class="card"><h2>Live activity</h2>${S.log.slice(0,8).map(l=>`<div class="msg">${esc(l)}</div>`).join("")||'<p class="sub">No activity yet.</p>'}</div>`}
function judgeView(){const L=S.cases.filter(c=>c.st==="escalated"||c.st==="closed"&&c.by);const c=S.jc&&C(S.jc);return `<div class="card"><h2>Cases escalated to you</h2>${L.map(x=>`<div class="row"><span></span><div><b data-j="${x.id}">${x.id}: ${esc(x.pet)} versus ${esc(x.res)}</b></div>${tag(x)}</div>`).join("")||'<p class="sub">No escalated cases yet.</p>'}</div>${c?`<div class="card"><h2>${c.id}</h2>${detail(c)}${c.st==="escalated"?`<div class="bar"><button class="b g" data-a="jagree">Agree with AI</button><button class="b p" data-a="jown">Issue own judgment</button></div>`:`<p><b>Closed:</b> ${esc(c.by)}</p>`}</div>`:""}`}
function partyView(){const L=S.cases;const c=C(S.pc||L[0].id);const side=S.ps;const me=side==="p"?c.pet:c.res;return `<div class="card"><h2>Party login</h2><div class="bar"><select data-pc>${L.map(x=>`<option value="${x.id}" ${x.id===c.id?"selected":""}>${x.id}</option>`).join("")}</select><select data-ps><option value="p" ${side==="p"?"selected":""}>As petitioner</option><option value="r" ${side==="r"?"selected":""}>As respondent</option></select></div><p class="sub">Signed in as ${esc(me)}</p>${detail(c)}${c.st==="awaiting"?(c.resp[side]===null?`<div class="bar"><button class="b g" data-a="acc">Accept</button><button class="b r" data-a="rej">Reject</button></div>`:`<p>You ${c.resp[side]?"accepted":"rejected"} the proposal.</p>`):`<p class="sub">Status: ${LBL[c.st]}</p>`}</div>`}
function render(){$("nav").innerHTML=ROLES.map(r=>`<button data-r="${r[0]}" class="${S.role===r[0]?"on":""}">${r[1]}</button>`).join("");$("app").innerHTML={op:opView,dash:dashView,judge:judgeView,party:partyView}[S.role]()}
function setPartyDone(c){if(c.resp.p===false||c.resp.r===false){c.st="escalated";note(c.id+": escalated to judge")}else if(c.resp.p&&c.resp.r){c.st="settled";note(c.id+": both accepted")}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-r],[data-a],[data-o],[data-j]");if(!t)return;const d=t.dataset;if(d.r)S.role=d.r;if(d.o)S.open=S.open===d.o?null:d.o;if(d.j)S.jc=d.j;const a=d.a,sel=[...S.sel].map(C);if(a==="train"){S.training=true;render();fetch("/api/train-demo",{method:"POST"}).then(r=>r.json()).then(()=>{S.training=false;S.model=true;S.apiLive=true;note("Model trained");render()}).catch(()=>{S.training=false;S.model=true;note("Simulated learning");render()});return}if(a==="run"){const pending=sel.filter(c=>c.st==="pending");if(!pending.length)return;S.running=true;render();Promise.all(pending.map(c=>fetch("/api/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:c.claim+" "+c.cat,k:3})}).then(r=>r.json()).then(pred=>{const oc=(pred.outcome||"").toLowerCase();const lean=(oc.includes("dismiss")||oc.includes("acquit"))?1:0;c.out=(OUT[c.cat]||["Proposal ready","Proposal ready"])[lean];c.conf=Math.round((pred.outcome_confidence||0.8)*100);c.pred=pred;c.st="proposed";note(c.id+": proposal ready")}).catch(()=>{c.out=OUT[c.cat][c.lean];c.conf=85;c.st="proposed";note(c.id+": simulated proposal")}))).finally(()=>{S.running=false;render()});return}if(a==="send"){sel.filter(c=>c.st==="proposed").forEach(c=>{c.st="awaiting";c.resp={p:null,r:null};note(c.id+": sent to parties")})}if(a==="sim"){S.cases.filter(c=>c.st==="awaiting").forEach(c=>{c.resp.p=Math.random()>0.3;c.resp.r=Math.random()>0.3;setPartyDone(c)})}if(a==="acc"||a==="rej"){const c=C(S.pc||S.cases[0].id);c.resp[S.ps]=a==="acc";setPartyDone(c)}if(a==="jagree"||a==="jown"){const c=C(S.jc);c.st="closed";c.by=a==="jagree"?"Agreed with AI proposal":"Judge issued own order";note(c.id+": "+c.by)}render()});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.s){if(t.checked)S.sel.add(t.dataset.s);else S.sel.delete(t.dataset.s);render()}if(t.dataset.f){S[t.dataset.f]=t.value;render()}if(t.dataset.pc){S.pc=t.value;render()}if(t.dataset.ps){S.ps=t.value;render()}});
render();
</script>
</body>
</html>
